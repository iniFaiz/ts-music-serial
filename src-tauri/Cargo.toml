[package]
name = "ts-music"
version = "1.0.0"
description = "A high-performance native desktop music player built with Tauri, Vue, and Rust"
authors = ["iniFaiz"]
edition = "2021"
license = "MIT"
repository = "https://github.com/iniFaiz/ts-music-serial"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ts_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
syn = { version = "2", features = ["full"] }
walkdir = "2.5"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
# Second app launches (e.g. double-clicking an associated audio file) focus the
# running instance and forward their argv instead of opening a second window.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10" #parallelism
parking_lot = "0.12" #faster, non-poisoning Mutex (no lock().unwrap() panic path)
# Embedded library database. `bundled` compiles SQLite from source (no system
# dependency on Windows) with FTS5 enabled — used for full-text track search,
# GROUP BY album/artist grouping and SQL smart-playlist evaluation.
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2.5" #directory traversal
jwalk = "0.8"
lofty = "0.21" #audio metadata parsing
base64 = "0.22" #images encoding
image = "0.25" #cover art decoding/downscaling
rodio = { version = "0.22", features = ["symphonia-all"] } #native audio playback/decoding (all formats incl. FLAC)
souvlaki = "0.8.3" #OS media controls (Windows SMTC / media keys)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] } #lyrics HTTP (rustls = no OpenSSL on Windows)
# Real async timer for the metadata importer's rate-limit pacing. Only the
# time driver is enabled; Tokio is already compiled in via Tauri/reqwest, so
# this adds no new dependency code — it just replaces a
# spawn_blocking(thread::sleep) that pinned a blocking-pool thread per wait.
tokio = { version = "1", default-features = false, features = ["time"] }
rusty-chromaprint = "0.3" #pure-Rust AcoustID-compatible audio fingerprints
notify = "6" #filesystem watching for library auto-update
ebur128 = "0.1" #EBU R128 loudness analysis for volume normalization (ReplayGain)
# NetEase eapi request signing (AES-128-ECB + MD5) to fetch word-by-word (yrc)
# and romanized (romalrc) lyrics, which its plain web API does not expose.
aes = "0.9"
ecb = { version = "0.2", features = ["alloc"] }
md-5 = "0.10"
hex = "0.4"
# Discord Rich Presence (now-playing status). Pure-Rust IPC to the local Discord
# client; cross-platform.
discord-rich-presence = "1.1"
# OS credential store for the (optional) Musixmatch user token, so it is never
# persisted in the app database as plaintext. `windows-native` uses the Windows
# Credential Manager; on other targets keyring compiles with a mock backend that
# simply reports "no token".
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "^2.10"
trash = "^5"
getrandom = "^0.4"

# Windows-only: native Taskbar thumbnail toolbar buttons (ITaskbarList3).
# Pinned to the same `windows` major already pulled in by tauri/tao/wry so the
# crate is shared (only a few extra feature modules compile).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WASAPI exclusive-mode output (bit-perfect). cpal/rodio only do shared mode, so
# the exclusive engine talks to WASAPI directly through this crate.
wasapi = "0.23"

# Optimize dependencies even in debug/dev builds. Audio codecs (symphonia) are
# math-heavy and unusably slow when compiled unoptimized — that is what made
# `tauri dev` take ~30s to start a track (the whole song is decoded up front).
# Our own crate stays unoptimized so incremental rebuilds remain fast; only the
# (rarely recompiled) dependencies get full optimization.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# Pinned to the exact commit already locked in Cargo.lock so a re-resolve can
# never silently float this dependency to an unreviewed branch head.
plist = { git = "https://github.com/ebarnard/rust-plist", rev = "2881e175b61f159a8a958765168733c0d5abe641" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
